version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
      - echo "NEXTAUTH_SECRET set? ${NEXTAUTH_SECRET:+YES}"
      - echo "NEXTAUTH_URL set? ${NEXTAUTH_URL:+YES}"
      - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
