version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - export AUTH_MICROSOFT_ENTRA_ID_ID=$(aws ssm get-parameter --name "/amplify/shared/d2xd0ob1rbbqjb/AUTH_MICROSOFT_ENTRA_ID_ID" --with-decryption --query "Parameter.Value" --output text)
        - export AUTH_MICROSOFT_ENTRA_ID_SECRET=$(aws ssm get-parameter --name "/amplify/shared/d2xd0ob1rbbqjb/AUTH_MICROSOFT_ENTRA_ID_SECRET" --with-decryption --query "Parameter.Value" --output text)
        - export AUTH_MICROSOFT_ENTRA_ID_ISSUER=$(aws ssm get-parameter --name "/amplify/shared/d2xd0ob1rbbqjb/AUTH_MICROSOFT_ENTRA_ID_ISSUER" --with-decryption --query "Parameter.Value" --output text)
        - export NEXTAUTH_SECRET=$(aws ssm get-parameter --name "/amplify/shared/d2xd0ob1rbbqjb/NEXTAUTH_SECRET" --with-decryption --query "Parameter.Value" --output text)

    build:
      commands:
        - echo "AUTH_MICROSOFT_ENTRA_ID_ID=$AUTH_MICROSOFT_ENTRA_ID_ID" >> .env.local
        - echo "AUTH_MICROSOFT_ENTRA_ID_SECRET=$AUTH_MICROSOFT_ENTRA_ID_SECRET" >> .env.local
        - echo "AUTH_MICROSOFT_ENTRA_ID_ISSUER=$AUTH_MICROSOFT_ENTRA_ID_ISSUER" >> .env.local
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.local
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.local
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*