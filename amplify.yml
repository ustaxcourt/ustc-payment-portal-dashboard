version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
      - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.local
      - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.local
      - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
