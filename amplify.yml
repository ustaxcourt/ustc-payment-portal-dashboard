version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - rm -f .env.production
        - |
          for name in AUTH_MICROSOFT_ENTRA_ID_ID AUTH_MICROSOFT_ENTRA_ID_SECRET AUTH_MICROSOFT_ENTRA_ID_ISSUER NEXTAUTH_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Amplify environment variable: $name" >&2
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> .env.production
          done
          if [ -n "${NEXTAUTH_URL:-}" ]; then
            printf 'NEXTAUTH_URL=%s\n' "$NEXTAUTH_URL" >> .env.production
          fi
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*