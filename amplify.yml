version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - rm -f .env.production
        - |
          node <<'EOF'
          const fs = require("fs");

          const required = [
            "AUTH_MICROSOFT_ENTRA_ID_ID",
            "AUTH_MICROSOFT_ENTRA_ID_SECRET",
            "AUTH_MICROSOFT_ENTRA_ID_ISSUER",
            "NEXTAUTH_SECRET",
            "NEXTAUTH_URL",
          ];

          let injected = {};
          if (process.env.secrets) {
            try {
              injected = JSON.parse(process.env.secrets);
            } catch (error) {
              console.error("Unable to parse Amplify secrets payload.");
              throw error;
            }
          }

          const lines = [];
          for (const name of required) {
            const value = process.env[name] ?? injected[name];
            if (!value) {
              console.error(`Missing required Amplify secret: ${name}`);
              process.exit(1);
            }
            lines.push(`${name}=${name === "NEXTAUTH_URL" ? value.replace(/\/+$/, "") : value}`);
          }

          fs.writeFileSync(".env.production", `${lines.join("\n")}\n`);
          EOF
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*