name: Entra Preview Redirects

# Every trigger here runs this file from main, which the entra-dev environment
# requires. `create` and `push` would run it from the pushed branch instead, so
# the schedule picks up new branches.
on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]
  delete:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_removals:
        description: Most URIs this run may remove
        type: number
        default: 10

permissions:
  contents: read
  id-token: write

concurrency:
  group: entra-preview-redirects
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: entra-dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - run: scripts/entra-preview-redirects/sync.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRA_APP_OBJECT_ID: ${{ secrets.ENTRA_APP_OBJECT_ID }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          MAX_REMOVALS: ${{ inputs.max_removals || 10 }}
